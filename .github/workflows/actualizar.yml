name: Actualizar precios

on:
  schedule:
    # Hora de Lima = UTC-5. Osinergmin sube el Excel cerca de las 4 pm.
    - cron: "37 21 * * *"   # 4:37 pm Lima
    - cron: "37 23 * * *"   # 6:37 pm Lima (segundo intento)
  workflow_dispatch:        # botón "Run workflow" para actualizar a mano
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas openpyxl
      - run: python actualizar.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
