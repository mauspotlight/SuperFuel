name: Actualizar precios

on:
  schedule:
    # Cada hora, en el minuto 10 (Osinergmin actualiza el Excel varias veces al día)
    - cron: "10 * * * *"
  workflow_dispatch:        # botón "Run workflow" para actualizar a mano
  push:
    branches: [main]
    paths-ignore: [coords.json]

permissions:
  contents: write   # para guardar coords.json (ubicaciones de los grifos)
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas openpyxl
      - run: python actualizar.py
      - name: Guardar ubicaciones
        run: |
          if [ -f coords.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add coords.json
            git diff --cached --quiet || (git commit -m "Actualizar ubicaciones de grifos" && git push)
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
